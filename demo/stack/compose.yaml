# Demo deployment for real-scenario tests. Two tiny workloads load their env files the way a real
# Compose deployment does. Apart from the dist templates, the files under environments/ are
# written by ENV Manager (or restored by `make demo-reset`) and are not committed.
name: env-manager-demo

services:
  api:
    image: alpine:3.24.2
    init: true
    env_file:
      - environments/.env.api
    # A check that always passes, so the stack overview has a healthy workload to show.
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 2s
      retries: 3
    # Prints the names, never the values, of the demo variables it received, then idles.
    command:
      - sh
      - -c
      - "env | cut -d= -f1 | grep '^DEMO_' | sort; exec sleep infinity"

  db:
    image: alpine:3.24.2
    init: true
    env_file:
      - environments/.env.db
      - environments/.env.db.secrets
    # Prints a line that holds the value of its engine setting (the Logs tab masks it), then the
    # names, never the values, of the demo variables it received, then idles. The doubled dollar
    # sign keeps Compose from reading the variable while the file is parsed.
    command:
      - sh
      - -c
      - "echo \"starting with engine $$DEMO_DB_ENGINE\"; env | cut -d= -f1 | grep '^DEMO_' | sort; exec sleep infinity"
