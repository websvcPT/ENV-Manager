[project]
name = "env-manager"
version = "0.1.0"
description = "Self-hosted manager for Docker Compose environment files"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[opentelemetry]==0.143.3",
    "uvicorn[standard]==0.54.0",
    "starlette==1.8.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.1.5",
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "cryptography==50.0.2",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.4",
    "typer==0.27.3",
    "apscheduler==3.11.3",
    "pwdlib[argon2]==0.3.1",
    "fastapi-mail==1.6.8",
    "slowapi==0.1.10",
    "pyotp==2.10.0",
    "segno==1.6.6",
    "httpx==0.28.1",
    "sentry-sdk[fastapi]==2.72.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
testpaths = ["app/tests"]

[tool.mypy]
strict = true
python_version = "3.14"
exclude = ["\\.venv", "app/alembic"]
disallow_subclassing_any = false

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["app/alembic", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101", "S105", "S106"]
"app/real_scenarios/**" = ["S101", "S105", "S106"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
