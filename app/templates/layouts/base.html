{% from "macros/feedback.html" import toast -%}
<!doctype html>
<html lang="en" class="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · ENV Manager</title>
<meta name="htmx-config" content='{"mode": "same-origin", "extensions": "", "noSwap": [204, 304, "5xx"]}'>
<link rel="icon" href="/static/brand/env-mark-solid.svg" type="image/svg+xml">
<link rel="icon" href="/static/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js"></script>
<script src="/static/htmx/htmx-{{ htmx_version }}.min.js" defer></script>
</head>
<body class="bg-bg font-sans text-sm text-ink" hx-headers:inherited='{{ {"X-CSRFToken": csrf_token}|tojson }}'>
{% block body %}{% endblock %}
<template id="error-toast-template">{{ toast("error", "The request failed. Your data is unchanged.", floating=true) }}</template>
</body>
</html>
