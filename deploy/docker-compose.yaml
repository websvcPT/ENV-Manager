# ENV Manager production example. Pin the image to a release tag or to the one you build, create
# data/master.key (a base64 encoded 32 byte key) and copy .env.example to .env next to this file.
# The settings live in .env; this file sets only what the file layout below fixes.
services:
  envmanager:
    image: websvcpt/env-manager:latest
    restart: unless-stopped
    container_name: envmanager
    env_file: .env
    environment:
      ENVMANAGER_KEY_FILE: /run/keys/master.key
    volumes:
      - ./data/runtime:/data
      - ./data/master.key:/run/keys/master.key:ro
      # optional: mount the host's vhosts and opt folders to be able to read/write files on the host
      - /var/www/vhosts:/var/www/vhosts
      - /opt:/opt
      # optional: enables post-deploy commands (root-equivalent on the host)
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add: ["<docker group id>"]
    ports:
      - 127.0.0.1:8080:8080
