# Browser specs (`make e2e`): the official Playwright image runs the specs in `playwright/`
# against the development stack (`make up-bg`) over its Compose network. The image tag comes
# from PLAYWRIGHT_VERSION, which the Makefile exports; the default is for a direct run. The
# version must equal the exact @playwright/test version in playwright/package.json, and
# `make check-pins` compares the three.
#
# The demo service runs the specs in `playwright/docker-tests` against the stack with the demo
# override up (`make e2e-demo`), where the app reaches the host Docker daemon. It also gets the
# demo folder of the host, which the specs use as a deployment root, and, from `make e2e-demo`,
# the address and the test login of a local registry (E2E_DEMO_REGISTRY, E2E_DEMO_REGISTRY_USER
# and E2E_DEMO_REGISTRY_PASSWORD, given with `run -e`).
#
# The playwright-sso service runs the specs in `playwright/sso-tests` for `make e2e-sso`. It joins the network
# of the separate app and Keycloak that docker-compose-e2e-sso.yml starts (the sso network below),
# never the development stack.
name: env-manager-e2e

x-browser: &browser
  image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:-1.64.1}-noble
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  init: true
  ipc: host
  working_dir: /e2e
  depends_on:
    node-modules-owner:
      condition: service_completed_successfully
  volumes:
    - ./playwright:/e2e
    # Dependencies install to /node_modules, a named volume outside the repository, so no
    # root-owned or generated files land in the working tree.
    - ./playwright/package.json:/package.json:ro
    - ./playwright/package-lock.json:/package-lock.json:ro
    - node-modules:/node_modules
    # The folder the stack's app container sees as /srv/deployments, so the specs can write and
    # remove the host files that deploys touch (as the same user, so every file is theirs).
    - ./dev/deployments:/srv/deployments
  networks:
    - default

services:
  node-modules-owner:
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:-1.64.1}-noble
    user: "0:0"
    volumes:
      - node-modules:/node_modules
    command: chown ${APP_UID:-1000}:${APP_GID:-1000} /node_modules

  playwright:
    <<: *browser
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://envmanager:8080
      # Development dataset login (the email), development and testing only.
      E2E_USER: root@example.test
      E2E_PASSWORD: dev-only-password
    # PLAYWRIGHT_ARGS (the ARGS of make e2e) narrows the run, for example
    # "--project=desktop tests/users.spec.ts"; quotes in it are read as typed.
    command:
      - sh
      - -c
      - npm ci --prefix / --no-audit --no-fund && eval "/node_modules/.bin/playwright test $${PLAYWRIGHT_ARGS:-}"

  playwright-demo:
    <<: *browser
    # A service-level list replaces the anchor's, so the shared mounts are repeated, plus the
    # demo folder at its host path: the specs edit and read the demo target files there.
    volumes:
      - ./playwright:/e2e
      - ./playwright/package.json:/package.json:ro
      - ./playwright/package-lock.json:/package-lock.json:ro
      - node-modules:/node_modules
      - ./dev/deployments:/srv/deployments
      - ${DEMO_ROOT:?run through make e2e-demo}:${DEMO_ROOT:?run through make e2e-demo}
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://envmanager:8080
      E2E_USER: root@example.test
      E2E_PASSWORD: dev-only-password
      E2E_DEMO_ROOT: ${DEMO_ROOT:-}
    command: sh -c "npm ci --prefix / --no-audit --no-fund && /node_modules/.bin/playwright test -c playwright.docker.config.ts"


  playwright-sso:
    <<: *browser
    networks:
      - sso
    environment:
      HOME: /tmp
      # The app instance and the Keycloak of docker-compose-e2e-sso.yml: the base URL is the one
      # the browser and the realm's redirect address use, the issuer the one Keycloak reports.
      E2E_BASE_URL: http://envmanager-sso:8080
      E2E_ISSUER: http://keycloak:8080/realms/envmanager-dev
      E2E_USER: root@example.test
      E2E_PASSWORD: dev-only-password
    # PLAYWRIGHT_ARGS (the ARGS of make e2e-sso) narrows the run, for example "--project=desktop".
    command:
      - sh
      - -c
      - npm ci --prefix / --no-audit --no-fund && eval "/node_modules/.bin/playwright test -c playwright.sso.config.ts $${PLAYWRIGHT_ARGS:-}"

volumes:
  node-modules:

networks:
  default:
    external: true
    name: env-manager_default
  sso:
    external: true
    name: ${E2E_SSO_NETWORK:-env-manager-e2e-sso_default}
