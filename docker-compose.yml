# Development stack: `make up`. The repository is bind mounted at /app; the virtualenv lives in
# a named volume so no root-owned files appear in the working tree.
name: env-manager

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    hostname: app
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Europe/Lisbon
      ENVMANAGER_ENVIRONMENT: development
      ENVMANAGER_LOG_LEVEL: debug
      ENVMANAGER_CSRF_SECRET: dev-not-secret-change-me-0123456789abcdef
      ENVMANAGER_SERVE_DOCS: "true"
      # Browser specs share one client address, so failed sign ins would otherwise lock it out
      # (20 in 15 minutes). Refused outside development and testing.
      ENVMANAGER_LOGIN_IP_MAX_FAILURES: "1000"
      # Development only key, not a secret. Real deployments mount a key file.
      ENVMANAGER_KEY: ${ENVMANAGER_KEY:-ZGV2LW9ubHktZW52LW1hbmFnZXIta2V5LTAxMjM0NTY=}
      UVICORN_OPTS: --reload
    # Browser specs reach the app under this name; a bare `app` host is treated as the
    # HSTS-preloaded `.app` top-level domain by Chromium and forced to https.
    networks:
      default:
        aliases:
          - envmanager
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - venv:/opt/venv
      - uv-cache:/opt/uv-cache
      - ./dev/data:/data
      - ./dev/deployments:/srv/deployments
    command: sh -c "uv sync --frozen && sh /app/start.sh"

  # Development mail catcher. The dev dataset points the SMTP settings at smtp4dev:25 and the
  # messages the app sends are read in its web UI at http://localhost:5080.
  smtp4dev:
    image: rnwood/smtp4dev:3.15.0
    hostname: smtp4dev
    ports:
      - "5080:80"

volumes:
  venv:
  uv-cache:
